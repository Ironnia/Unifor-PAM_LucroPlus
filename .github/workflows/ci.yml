name: CI - LucroPlus

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Maven
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Permitir execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e executar testes
        run: ./mvnw --batch-mode --no-transfer-progress test

  mobile:
    name: Mobile / Expo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::mobile/package-lock.json ainda nao foi versionado; usando npm install provisoriamente."
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Validar configuracao do Expo
        run: npx expo config --type public > /dev/null

      - name: Gerar bundle Android quando os pre-requisitos estiverem presentes
        shell: bash
        run: |
          if [ -f package-lock.json ] \
            && [ -f assets/icon.png ] \
            && [ -f assets/splash.png ] \
            && [ -f assets/adaptive-icon.png ]; then
            npx expo export --platform android --output-dir dist-ci
          else
            echo "::warning::Bundle Android adiado: integre o lockfile e os assets do kit S2-A."
          fi

  contracts:
    name: Contratos / SQL e Postman
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Validar script SQL
        shell: bash
        run: |
          test -f database/lucroplus.sql
          grep -q "CREATE TABLE" database/lucroplus.sql

      - name: Validar sintaxe da colecao Postman
        run: python3 -m json.tool docs/postman/LucroPlus_Sprint2.postman_collection.json > /dev/null
