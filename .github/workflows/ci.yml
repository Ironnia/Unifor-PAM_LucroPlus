name: CI - LucroPlus

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Maven
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: "chave-secreta-para-testes-ci-com-pelo-menos-32-chars"
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress test

  mobile:
    name: Mobile / Expo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npx --yes expo-doctor
      - run: npx expo export --platform android --output-dir dist-ci

  frontend:
    name: Frontend legado / Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  contracts:
    name: Contratos / SQL e Postman
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - run: test -f database/lucroplus.sql
      - run: grep -q "CREATE TABLE" database/lucroplus.sql
      - name: Validar migrations SQL
        shell: bash
        run: |
          shopt -s nullglob
          migrations=(database/migrations/*.sql)
          test "${#migrations[@]}" -gt 0

          for migration in "${migrations[@]}"; do
            test -s "$migration"
            grep -Eiq '^[[:space:]]*(CREATE|ALTER|INSERT|UPDATE)([[:space:]]|$)' "$migration"
          done
      - run: python3 -m json.tool docs/postman/LucroPlus_Sprint2.postman_collection.json > /dev/null
